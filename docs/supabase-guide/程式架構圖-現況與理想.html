<text x="720" y="513" font-size="9" font-weight="bold" fill="#b03a2b" text-anchor="end">全檔 34 次 ME. · 15 次 LOCAL_MODE 分支</text>
<rect x="30" y="520" width="222" height="180" rx="3" fill="#ffffff" stroke="#e0cbb0"/>
<text x="38" y="536" font-size="9.6" font-weight="bold" fill="#6b3f1c">登入</text>
<text x="38" y="552" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">LOCAL_MODE = 沒有 authMode</text>
<text x="38" y="565" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">LOCAL_ACCOUNTS[]</text>
<text x="38" y="578" font-size="8.4" fill="#6d5a48">   帳號 + sha256 雜湊 + 角色</text>
<text x="38" y="594" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">login()</text>
<text x="38" y="607" font-size="8.4" fill="#6d5a48">   算 sha256(帳號:密碼) 去比對</text>
<text x="38" y="623" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">authIdentity() / setMe()</text>
<text x="38" y="636" font-size="8.4" fill="#6d5a48">   組出 ME = { id, role, name, sync }</text>
<text x="38" y="652" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">applyRole()</text>
<text x="38" y="665" font-size="8.4" fill="#6d5a48">   決定 Admin 分頁露不露出來</text>
<text x="38" y="682" font-size="8.4" fill="#b03a2b">Supabase 那條路的程式碼也在這裡,</text>
<text x="38" y="694" font-size="8.4" fill="#b03a2b">只是沒有被走到</text>

<rect x="262" y="520" width="222" height="180" rx="3" fill="#fdf4ea" stroke="#b3611f" stroke-width="1.6"/>
<text x="270" y="536" font-size="9.6" font-weight="bold" fill="#b3611f">★ 接縫 —— 身分只從這裡外流</text>
<text x="270" y="553" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">whoKey()  →  ME.id 或 "anon"</text>
<text x="270" y="567" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">histKey()  →  期別索引</text>
<text x="270" y="581" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">histRuleKey()  →  歷史規則</text>
<text x="270" y="595" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">histInvKey()  →  帳單清單</text>
<text x="270" y="609" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">idbName()  →  IndexedDB 名</text>
<text x="270" y="623" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">cfgKeys()  →  費率設定</text>
<text x="270" y="642" font-size="8.4" fill="#2b2019">六個都是同一個公式:</text>
<text x="270" y="656" font-size="8.6" font-family="DejaVu Sans Mono" fill="#b3611f">原本的 key + "::" + whoKey()</text>
<text x="270" y="674" font-size="8.4" font-weight="bold" fill="#b03a2b">身分一換 → 前綴全換 →</text>
<text x="270" y="682" font-size="8.4" font-weight="bold" fill="#b03a2b">畫面上東西「不見了」</text>
<text x="270" y="694" font-size="8.4" fill="#6d5a48">(資料還在,在舊前綴底下)</text>

<rect x="494" y="520" width="236" height="180" rx="3" fill="#ffffff" stroke="#e0cbb0"/>
<text x="502" y="536" font-size="9.6" font-weight="bold" fill="#6b3f1c">雲端同步與帳號管理</text>
<text x="502" y="552" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">cfgPush() / cfgPull()</text>
<text x="502" y="565" font-size="8.4" fill="#6d5a48">   費率設定上下雲,鑰匙 = ME.sync</text>
<text x="502" y="581" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">histCloudPush / Pull / Delete</text>
<text x="502" y="594" font-size="8.4" fill="#6d5a48">   帳單歷史,先 gzip 再上傳</text>
<text x="502" y="610" font-size="8.6" font-family="DejaVu Sans Mono" fill="#2b2019">claimLegacy()</text>
<text x="502" y="623" font-size="8.4" fill="#6d5a48">   認領「分帳號之前」的共用歷史</text>
<text x="502" y="636" font-size="8.4" fill="#6d5a48">   —— 注意:不是身分搬遷</text>
<text x="502" y="652" font-size="8.6" font-family="DejaVu Sans Mono" fill="#6d6558">adminCall() / recordLogin()</text>
<text x="502" y="665" font-size="8.4" fill="#6d6558">   loadUsers() / loadLoginHistory()</text>
<text x="502" y="682" font-size="8.4" fill="#b03a2b">這四個要有 Supabase 登入才會動,</text>
<text x="502" y="694" font-size="8.4" fill="#b03a2b">現在等於閒置</text>

<!-- ===== 右欄 ===== -->
<rect x="754" y="56" width="298" height="286" rx="4" fill="#fdf4ea" stroke="#b3611f" stroke-width="1.4"/>
<rect x="754" y="56" width="298" height="22" rx="4" fill="#b3611f"/>
<text x="764" y="71" font-size="10" font-weight="bold" fill="#ffffff">重點一:身分是怎麼滲進整個程式的</text>
<text x="764" y="94" font-size="8.8" fill="#2b2019">全檔提到 ME. 有 34 次,聽起來像散得到處都是。</text>
<text x="764" y="107" font-size="8.8" fill="#2b2019">實際上其中 24 次就在身分層自己裡面,引擎和</text>
<text x="764" y="120" font-size="8.8" fill="#2b2019">資料層合計只有 5 次,UI 只有 2 次。</text>
<text x="764" y="140" font-size="8.8" font-weight="bold" fill="#b3611f">真正把身分帶進資料的,只有左邊那 6 個函式。</text>
<text x="764" y="160" font-size="8.8" fill="#2b2019">這件事有兩個意思,一好一壞:</text>
<text x="764" y="180" font-size="8.8" font-weight="bold" fill="#b03a2b">壞的:換身分 = 換前綴。費率、期別索引、</text>
<text x="764" y="193" font-size="8.8" fill="#b03a2b">帳單清單、IndexedDB 全部一起改名,畫面上</text>
<text x="764" y="206" font-size="8.8" fill="#b03a2b">看起來像資料被清空了。</text>
<text x="764" y="226" font-size="8.8" font-weight="bold" fill="#2f6b3a">好的:要補的搬遷程式很小、很明確 —— 就是</text>
<text x="764" y="239" font-size="8.8" fill="#2f6b3a">把這 6 個前綴的舊值搬到新值,一個地方改完</text>
<text x="764" y="252" font-size="8.8" fill="#2f6b3a">全部生效。不是散在 34 個地方要慢慢找。</text>
<text x="764" y="272" font-size="8.8" fill="#6d5a48">另外有一個小瑕疵:cfgKeys() 沒有呼叫</text>
<text x="764" y="285" font-size="8.8" fill="#6d5a48">whoKey(),而是自己把同一行邏輯再寫一次。</text>
<text x="764" y="298" font-size="8.8" fill="#6d5a48">現在結果一樣,但那是兩個真相來源。</text>
<text x="764" y="318" font-size="8.8" font-weight="bold" fill="#351C15">要動身分之前,先把它改成呼叫 whoKey(),</text>
<text x="764" y="331" font-size="8.8" font-weight="bold" fill="#351C15">讓接縫真的只有一條。</text>

<rect x="754" y="352" width="298" height="184" rx="4" fill="#eef6ee" stroke="#2f6b3a" stroke-width="1.4"/>
<rect x="754" y="352" width="298" height="22" rx="4" fill="#2f6b3a"/>
<text x="764" y="367" font-size="10" font-weight="bold" fill="#ffffff">重點二:計價引擎不知道有沒有登入這回事</text>
<text x="764" y="390" font-size="8.8" fill="#2b2019">第 1,670 到 3,145 行,共 1,476 行。在這段裡</text>
<text x="764" y="403" font-size="8.8" fill="#2b2019">搜尋 ME、AUTH、SYNC、supabase、LOCAL_MODE、</text>
<text x="764" y="416" font-size="8.8" fill="#2b2019">localStorage、indexedDB:</text>
<text x="764" y="436" font-size="13" font-weight="bold" fill="#2f6b3a">命中 0 次。</text>
<text x="764" y="458" font-size="8.8" fill="#2b2019">它只吃兩樣東西 —— 一份帳單、一份費率表;</text>
<text x="764" y="471" font-size="8.8" fill="#2b2019">吐一份逐筆結果。誰在用、有沒有登入、資料</text>
<text x="764" y="484" font-size="8.8" fill="#2b2019">存在哪,它完全不知道,也不需要知道。</text>
<text x="764" y="504" font-size="8.8" font-weight="bold" fill="#1f4d29">所以換登入方式,動不到它一個字。</text>
